services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_BIND_IP:-127.0.0.1}:${APP_PORT:-3100}:3000"
    env_file: .env
    environment:
      DATABASE_URL: "postgresql://kleiderpfad:${DB_PASSWORD}@db:5432/kleiderpfad"
      UPLOAD_DIR: /data/uploads
    volumes:
      - app_uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kleiderpfad
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_DB: kleiderpfad
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kleiderpfad -d kleiderpfad"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]
networks:
  internal:
    driver: bridge
volumes:
  postgres_data:
  app_uploads:
