name: Render Kleidolino brand PNG and WebP

on:
  push:
    branches: [main]
    paths:
      - "docs/corporate-design/assets/**/*.svg"
      - "docs/corporate-design/tools/render_assets.py"
      - ".github/workflows/brand-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-kleidolino-brand
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SVG renderer
        run: python -m pip install --disable-pip-version-check cairosvg pillow
      - name: Check and render master SVGs
        run: python docs/corporate-design/tools/render_assets.py
      - name: Commit derived PNG and WebP images
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/corporate-design/raster
          if git diff --cached --quiet; then
            echo "No generated asset changes."
            exit 0
          fi
          git commit -m "design: render Kleidolino PNG/WebP assets [skip ci]"
          git push origin HEAD:main
